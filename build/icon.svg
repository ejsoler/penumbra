<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a293ff"/>
      <stop offset="0.55" stop-color="#7560f0"/>
      <stop offset="1" stop-color="#4a33c9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b0f5c" flood-opacity="0.45"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#23127a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body centred on a 1024px canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
  <g filter="url(#glyph)">
    <circle cx="512" cy="512" r="232" fill="none" stroke="#fff" stroke-width="46"/>
    <path d="M512 280 A232 232 0 0 0 512 744 Z" fill="#fff"/>
  </g>
</svg>
